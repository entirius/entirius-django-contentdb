[project]
name = "entirius-django-contentdb"
version = "5.0.0"
description = "ContentDB Django module for Volkanos"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.0.0",
    "djangorestframework>=3.12.4",
    "djangorestframework-simplejwt>=5.2.0",
    "django-filter>=2.4.0",
    "drf-extra-fields>=3.1.1",
    "drf-spectacular>=0.27.0",
    "pydantic>=2.0",
    "Pillow>=7.1.1",
    "python-dateutil>=2.8.1",
    "python-slugify>=4.0.0",
    "factory-boy>=3.2.1",
    "celery>=5.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-image-transformations>=2.0.0",
    "entirius-django-pim>=3.0.0",
    "entirius-django-regional>=2.0.0",
    "entirius-django-utils>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-contentdb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_contentdb"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "B017"]
# Legacy migrated 1:1
"src/django_contentdb/admin.py" = ["S308"]
"src/django_contentdb/api/**" = ["B904"]
"src/django_contentdb/filters/**" = ["C416"]
"src/django_contentdb/image_manager.py" = ["UP042"]
"src/django_contentdb/models/**" = ["DJ001", "DJ008", "DJ012"]
"src/django_contentdb/serializers/**" = ["B904", "E731", "F841"]
"src/django_contentdb/tests.py" = ["S101", "F841"]
"src/django_contentdb/utils.py" = ["B904", "S110"]
"src/django_contentdb/views/**" = ["B026", "B904", "E731", "S110"]

[tool.ruff.lint.isort]
known-first-party = ["django_contentdb"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
